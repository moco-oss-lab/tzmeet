[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tzmeet"
version = "0.1.0"
description = "Find meeting windows that work across timezones"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Moco"}]

[project.scripts]
tzmeet = "tzmeet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
